line-length = 100
target-version = "py311"
# Note: vendored 01-*/05-*/rtai_core excluded from lint to avoid double-counting;
# drift is enforced by tests/test_meta.py:23-35 byte-identity check. Re-enable per-folder
# via --exclude='' if auditing vendored copies.
exclude = ["docs", ".git", ".venv", "0*-*/rtai_core", "0*/*/rtai_core/gui", "scripts"]

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "W605"]
ignore = ["F401"] # F401 allowed in providers __init__ re-exports

[lint.per-file-ignores]
"rtai_core/providers/__init__.py" = ["F401"]
