[mypy]
files = rtai_core
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True

# Military extensions depend on optional native libs (liboqs, TPM2, SPIRE) — degrade gracefully
# See docs/MILITARY_GRADE_GAP_ANALYSIS.md:25 MG-13 — strict elsewhere, relaxed for military+gui
# Note: services/api not in mypy files by design (see gap G8.2); type-check it separately in CI if needed.
[mypy-rtai_core.military_mtls]
ignore_errors = True
[mypy-rtai_core.military_tpm]
ignore_errors = True
[mypy-rtai_core.military_pqc]
ignore_errors = True
[mypy-rtai_core.military_stix]
ignore_errors = True
[mypy-rtai_core.military_tla]
ignore_errors = True
[mypy-rtai_core.military_sbom]
ignore_errors = True
[mypy-rtai_core.military_opa]
ignore_errors = True
[mypy-rtai_core.military_airgap]
ignore_errors = True
[mypy-rtai_core.gui.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-rtai_core.cli_app]
disallow_any_decorated = False
