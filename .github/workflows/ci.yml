name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install dnspython jinja2 jsonschema pytest pytest-cov ruff
      - name: Byte-compile all sources
        run: python -m compileall -q .
      - name: Run unit tests with coverage
        run: pytest --cov=rtai_core --cov-report=term-missing
